<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Video Streaming</title>
</head>
<body>
  <h1>WebRTC Video Streaming</h1>
  <video id="video" autoplay playsinline style="display:none;"></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script>
    const videoElement = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const socket = new WebSocket('wss://axysites.ru:8089');
  
    const peerConnection = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: 'turn:axysites.ru:3478',
          username: 'admin',
          credential: '1111'
        }
      ],
    });
  
    socket.onopen = () => {
      console.log('[CLIENT] WebSocket подключен');
      socket.send(JSON.stringify({ type: 'register', role: 'client' }));
    };
  
    socket.onmessage = async (event) => {
      console.log('[WS] Пришло сообщение от сервера:', event.data); // вывод всего
      const message = JSON.parse(event.data);
  
      if (message.type === 'offer') {
        try {
          console.log('[WS] Пришёл offer от сервера\n', message.sdp);
          const offer = new RTCSessionDescription({ type: 'offer', sdp: message.sdp });
          await peerConnection.setRemoteDescription(offer);
          console.log('[WS] Offer установлен');
  
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          console.log('[WS] Answer создан и установлен');
  
          socket.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
          console.log('[WS] Answer отправлен серверу');
        } catch (error) {
          console.error('Ошибка при обработке offer:', error);
        }
      } else if (message.type === 'candidate') {
        try {
          console.log('[WS] Пришёл кандидат ICE:', message.candidate);
          const candidate = new RTCIceCandidate(message.candidate);
          await peerConnection.addIceCandidate(candidate);
          console.log('[WS] ICE кандидат добавлен');
        } catch (error) {
          console.error('Ошибка при добавлении ICE кандидата:', error);
        }
      } else {
        console.warn('[WS] Неизвестный тип сообщения:', message);
      }
    };
  
    peerConnection.ontrack = (event) => {
      console.log('[RTC] Получен медиатрек:', event.track.kind);
      if (event.track.kind === 'video') {
        videoElement.srcObject = event.streams[0];
        videoElement.style.display = 'block';
  
        const drawToCanvas = () => {
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
          requestAnimationFrame(drawToCanvas);
        };
  
        drawToCanvas();
      }
    };
  
    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        console.log('[RTC] Отправка ICE кандидата:', event.candidate);
        socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
      }
    };
  
    peerConnection.oniceconnectionstatechange = () => {
      console.log('[RTC] ICE состояние соединения:', peerConnection.iceConnectionState);
    };
  
    peerConnection.onconnectionstatechange = () => {
      console.log('[RTC] Общее состояние соединения:', peerConnection.connectionState);
    };
  </script>
  
</body>
</html>
