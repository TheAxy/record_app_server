<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC Video Streaming</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video, canvas { max-width: 100%; margin-top: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>WebRTC Video Streaming</h1>
  <video id="video" autoplay playsinline controls muted style="display: block;"></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script>
    const videoElement = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const socket = new WebSocket('ws://89.104.71.153:8089');

    const peerConnection = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    socket.onopen = () => {
      console.log('[WS] Подключено к серверу');
      socket.send(JSON.stringify({ type: 'register', role: 'client' }));
    };

    socket.onmessage = async (event) => {
      const message = JSON.parse(event.data);

      if (message.type === 'offer') {
        try {
          peerConnection.addTransceiver('video', { direction: 'recvonly' });
          await peerConnection.setRemoteDescription(new RTCSessionDescription({
            type: 'offer',
            sdp: message.sdp
          }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.send(JSON.stringify({ type: 'answer-to-server', sdp: answer.sdp }));
          console.log('[RTC] Ответ отправлен');
        } catch (error) {
          console.error('[RTC] Ошибка при обработке offer:', error);
        }
      } else if (message.type === 'candidate') {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
        } catch (error) {
          console.error('[RTC] Ошибка при добавлении ICE кандидата:', error);
        }
      }
    };

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
      }
    };

    peerConnection.ontrack = (event) => {
      console.log('[RTC] Получен медиатрек:', event);
      const stream = event.streams[0] || new MediaStream([event.track]);
      if (stream) {
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
        videoElement.play().catch(err => {
          console.error('[CLIENT] Ошибка при воспроизведении видео:', err);
        });
        drawToCanvas();
      } else {
        console.error('[RTC] Поток не найден в ontrack');
      }
    };

    videoElement.onloadedmetadata = () => {
      console.log('[VIDEO] Метаданные загружены:', videoElement.videoWidth, videoElement.videoHeight);
    };

    videoElement.onerror = () => {
      console.error('[VIDEO] Ошибка:', videoElement.error);
    };

    function drawToCanvas() {
      if (videoElement.readyState >= 2) {
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(drawToCanvas);
    }
  </script>
</body>
</html>
